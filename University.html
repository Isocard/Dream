<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xx大学简介</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231a73e8' d='M12 3l9 5v2H3V8z'/%3E%3Crect x='5' y='10' width='4' height='8' fill='%231a73e8'/%3E%3Crect x='10' y='10' width='4' height='8' fill='%231a73e8'/%3E%3Crect x='15' y='10' width='4' height='8' fill='%231a73e8'/%3E%3Crect x='3' y='19' width='18' height='2' fill='%231a73e8'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f6f8fb;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    color: #222;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .page {
    width: min(880px, 92vw);
    background: #fff;
    margin: 40px auto;
    border-radius: 14px;
    box-shadow: 0 10px 34px rgba(0,0,0,.08);
    overflow: hidden;
  }

  .head {
    background: #1a73e8;
    color: #fff;
    padding: 40px 36px 32px;
  }
  .head .name { font-size: 32px; font-weight: 700; letter-spacing: .08em; }
  .head .subtitle {
    margin-top: 10px;
    font-size: 15px;
    color: rgba(255,255,255,.88);
    letter-spacing: .04em;
  }

  .body { padding: 28px 36px 40px; }

  .section { margin-bottom: 28px; }
  .section:last-child { margin-bottom: 0; }

  .sec-title {
    font-size: 16px;
    font-weight: 700;
    color: #1a73e8;
    letter-spacing: .1em;
    padding-bottom: 8px;
    border-bottom: 2px solid #e8f0fe;
    margin-bottom: 16px;
  }

  /* 简介 */
  .intro p { font-size: 15px; line-height: 2; color: #333; text-indent: 2em; }
  .intro .hl { color: #1a73e8; font-weight: 700; }

  /* 数据 */
  .data-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .data-card {
    background: #f6f8fb;
    border: 1px solid #e8ecf2;
    border-radius: 10px;
    padding: 18px 16px;
    text-align: center;
  }
  .data-card .num { font-size: 22px; font-weight: 700; color: #1a73e8; }
  .data-card .unit { font-size: 13px; color: #5f6368; margin-top: 6px; }

  /* 图片区 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .gallery figure { margin: 0; }
  .gallery img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #e6e8eb;
    display: block;
  }
  .gallery figcaption {
    margin-top: 8px;
    font-size: 13px;
    color: #9aa0a6;
    text-align: center;
  }

  @media (max-width: 720px) {
    .data-grid { grid-template-columns: 1fr; }
    .gallery { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <main class="page">
    <header class="head">
      <h1 class="name">xx大学</h1>
      <p class="subtitle">xx省西林市 · 综合性公立大学 · 国家“双一流”建设高校</p>
    </header>

    <div class="body">

      <section class="section intro">
        <h2 class="sec-title">学校简介</h2>
        <p>xx大学是<span class="hl">xx省西林市</span>一所<span class="hl">综合性公立大学</span>，创建于<span class="hl">1901年</span>，是国家<span class="hl">“双一流”建设高校</span>。</p>
      </section>

      <section class="section">
        <h2 class="sec-title">校园数据</h2>
        <div class="data-grid">
          <div class="data-card"><div class="num">2.18 万亩</div><div class="unit">学校占地</div></div>
          <div class="data-card"><div class="num">约 142 万 m²</div><div class="unit">校舍总建筑面积</div></div>
          <div class="data-card"><div class="num">约 31.97 亿元</div><div class="unit">教学科研设备总值</div></div>
        </div>
      </section>

      <section class="section">
        <h2 class="sec-title">校园风貌</h2>
        <div class="gallery">
          <figure>
            <img src="assets/campus-building.png" alt="校园教学楼全景">
            <figcaption>教学楼全景</figcaption>
          </figure>
          <figure>
            <img src="assets/campus-track.png" alt="教学楼与400米标准跑道、足球场">
            <figcaption>400米标准跑道与足球场</figcaption>
          </figure>
          <figure>
            <img src="assets/campus-court.png" alt="教学楼旁三个标准篮球场">
            <figcaption>三个标准篮球场</figcaption>
          </figure>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
