<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电脑桌面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Crect x='8' y='14' width='56' height='40' rx='3' fill='%233a3f47'/%3E%3Crect x='12' y='18' width='48' height='32' rx='2' fill='%235b6470'/%3E%3Crect x='30' y='54' width='12' height='6' fill='%233a3f47'/%3E%3Crect x='22' y='60' width='28' height='4' rx='2' fill='%233a3f47'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  /* 显示器外框 */
  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }

  .monitor {
    position: relative;
    width: min(1280px, 96vw);
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 0 1px #1e1e1e, 0 24px 60px rgba(0,0,0,.7);
  }

  .wallpaper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  /* ===== 桌面图标 ===== */
  .desktop-icon {
    position: absolute;
    left: 20px;
    width: 92px;
    padding: 8px 6px;
    border-radius: 6px;
    text-align: center;
    user-select: none;
  }
  .desktop-icon .icon { width: 60px; height: 60px; margin: 0 auto 6px; display: block; }
  .desktop-icon .label {
    display: block;
    color: #fff;
    font-size: 14px;
    letter-spacing: .05em;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
    line-height: 1.35;
  }
  /* hover 仅呈现「可选中」视觉，不承诺可打开 */
  .desktop-icon.hoverable:hover {
    background: rgba(255,255,255,.12);
    outline: 1px solid rgba(255,255,255,.35);
    cursor: default;
  }
  #browserIcon { top: 18px; cursor: pointer; }
  #browserIcon:hover { background: rgba(255,255,255,.14); outline: 1px solid rgba(255,255,255,.4); }
  #computerIcon { top: 132px; cursor: default; }

  /* ===== 浏览器窗口 ===== */
  .browser-window {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .browser-window.open { display: flex; }

  .browser {
    width: min(920px, 88%);
    height: 86%;
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
  }

  .browser-bar {
    background: #dee1e6;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .browser-dots { display: flex; gap: 6px; flex-shrink: 0; }
  .browser-dots span { width: 11px; height: 11px; border-radius: 50%; }
  .browser-dots span:nth-child(1) { background: #ff5f57; }
  .browser-dots span:nth-child(2) { background: #febc2e; }
  .browser-dots span:nth-child(3) { background: #28c840; }

  /* 动态标签栏 */
  .browser-tabs {
    flex: 1;
    display: flex;
    align-items: flex-end;
    background: #e9ebef;
    border-radius: 7px;
    padding: 4px 6px 0;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .browser-tabs .tab {
    font-size: 13px;
    color: #333;
    background: #d8dbdf;
    padding: 5px 10px;
    border-radius: 6px 6px 0 0;
    margin-right: 2px;
    white-space: nowrap;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 170px;
    flex-shrink: 0;
    user-select: none;
  }
  .browser-tabs .tab.active {
    background: #fff;
    font-weight: 600;
  }
  .tab-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #777;
    line-height: 1;
    padding: 2px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
  }
  .tab-close:hover { background: rgba(0,0,0,.15); color: #222; }

  .address-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 16px;
    padding: 6px 14px;
    min-width: 180px;
    flex-shrink: 0;
  }
  .address-bar input {
    border: none;
    outline: none;
    font-size: 16px;
    color: #333;
    background: transparent;
    width: 100%;
  }

  .close-btn {
    border: none;
    background: transparent;
    font-size: 15px;
    color: #555;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .close-btn:hover { background: rgba(0,0,0,.1); color: #111; }

  .browser-body {
    flex: 1;
    position: relative;
    background: #fff;
    overflow: hidden;
  }

  /* ===== 搜索引擎主页 ===== */
  .search-home {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    background: #fff;
  }
  .search-home.show { display: flex; }
  .site-name {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: .1em;
    color: #202124;
    margin-bottom: 28px;
  }
  .site-name em { font-style: normal; color: #1a73e8; }
  .search-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
  .search-row input {
    flex: 1;
    font-size: 16px;
    padding: 12px 18px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    outline: none;
    color: #222;
    background: #fff;
  }
  .search-row input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.18); }
  .search-row button {
    font-size: 15px;
    padding: 12px 26px;
    border: none;
    border-radius: 24px;
    background: #1a73e8;
    color: #fff;
    cursor: pointer;
  }
  .search-row button:hover { background: #1765cc; }

  /* ===== 搜索结果 ===== */
  .search-result {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px;
    text-align: left;
    background: #fff;
    overflow-y: auto;
  }
  .search-result.show { display: flex; }
  .result-head {
    font-size: 13px;
    color: #70757a;
    margin: 6px 0 10px;
  }
  .result-item {
    padding: 14px 0;
    border-bottom: 1px solid #f1f3f4;
  }
  .result-item .r-title { font-size: 18px; line-height: 1.4; }
  .result-item .r-url { font-size: 13px; color: #006621; margin-top: 2px; }
  .result-item .r-desc { font-size: 14px; color: #4d5156; margin-top: 4px; line-height: 1.7; }
  .result-item.openable { cursor: pointer; }
  .result-item.openable .r-title { color: #1a0dab; }
  .result-item.openable:hover .r-title { text-decoration: underline; }
  .result-item.locked { cursor: default; opacity: .8; }
  .result-item.locked .r-title { color: #5f6368; }
  .result-empty {
    text-align: center;
    color: #5f6368;
    font-size: 15px;
    padding: 48px 0;
  }
  .back-link { text-align: center; padding-top: 18px; }
  .back-link button {
    border: none;
    background: transparent;
    color: #1a73e8;
    font-size: 14px;
    cursor: pointer;
  }

  /* ===== 打开的网页标签（iframe） ===== */
  .tab-pages { position: absolute; inset: 0; pointer-events: none; }
  .tab-page { display: none; position: absolute; inset: 0; }
  .tab-page.show { display: block; pointer-events: auto; }
  .tab-page iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }
</style>
</head>
<body>

  <div class="monitor">
    <!-- 壁纸 -->
    <img class="wallpaper" src="pc desktop.png" alt="电脑壁纸">

    <!-- 桌面图标 -->
    <div class="desktop-icon" id="browserIcon" title="浏览器">
      <svg class="icon" viewBox="0 0 72 72" aria-hidden="true">
        <circle cx="36" cy="36" r="33" fill="#1a73e8"/>
        <circle cx="36" cy="36" r="24" fill="#e8f0fe"/>
        <path d="M36 12 L43 29 L60 36 L43 43 L36 60 L29 43 L12 36 L29 29 Z" fill="#1a73e8"/>
        <circle cx="36" cy="36" r="6" fill="#ffffff"/>
      </svg>
      <span class="label">浏览器</span>
    </div>

    <div class="desktop-icon hoverable" id="computerIcon" title="计算机">
      <svg class="icon" viewBox="0 0 72 72" aria-hidden="true">
        <rect x="8" y="12" width="56" height="40" rx="3" fill="#2f343b"/>
        <rect x="13" y="17" width="46" height="30" rx="2" fill="#5b6470"/>
        <path d="M30 52 h12 l-2 6 h-8 Z" fill="#2f343b"/>
        <rect x="20" y="58" width="32" height="5" rx="2" fill="#2f343b"/>
      </svg>
      <span class="label">计算机</span>
    </div>

    <!-- 浏览器窗口 -->
    <div class="browser-window" id="browserWindow">
      <div class="browser" role="dialog" aria-label="浏览器窗口">
        <div class="browser-bar">
          <div class="browser-dots"><span></span><span></span><span></span></div>
          <div class="browser-tabs" id="tabStrip"></div>
          <div class="address-bar">
            <span class="lock"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            <input id="addressInput" value="https://www.互联网.com" readonly>
          </div>
          <button class="close-btn" id="closeBrowser" aria-label="关闭浏览器">&#10005;</button>
        </div>

        <div class="browser-body">
          <!-- 首页：搜索引擎 -->
          <div class="search-home" id="searchHome">
            <div class="site-name">互联网<em>www</em></div>
            <div class="search-row">
              <input id="searchInput" type="text" placeholder="输入你想搜索的内容…" autocomplete="off" maxlength="60">
              <button id="searchBtn">搜索</button>
            </div>
          </div>

          <!-- 搜索结果 -->
          <div class="search-result" id="searchResult">
            <p class="result-head" id="resultHead"></p>
            <div class="result-list" id="resultList"></div>
            <p class="result-empty" id="resultEmpty"></p>
            <div class="back-link"><button id="backBtn">返回首页</button></div>
          </div>

          <!-- 打开的网页标签页 -->
          <div class="tab-pages" id="tabPages"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  /* ===== 桌面交互 ===== */

  /* 浏览器：单击打开 */
  document.getElementById('browserIcon').addEventListener('click', function () {
    document.getElementById('browserWindow').classList.add('open');
  });

  /* 计算机：点击不响应（不弹窗、不跳转、无任何动作） */
  document.getElementById('computerIcon').addEventListener('click', function () {
    /* 无操作：该图标无法打开 */
  });

  /* 关闭浏览器窗口 */
  document.getElementById('closeBrowser').addEventListener('click', function () {
    document.getElementById('browserWindow').classList.remove('open');
  });

  /* ===== 浏览器多标签 ===== */
  var home   = document.getElementById('searchHome');
  var result = document.getElementById('searchResult');
  var tabSeq = 0;
  var activeTabId = 'home';
  var tabs = [
    { id: 'home', title: '互联网www', type: 'home', url: 'https://www.互联网.com' }
  ];
  var homeView = 'home'; /* home 标签内的视图：home 主页 / search 结果 */

  function getTab(id) {
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].id === id) return tabs[i];
    }
    return null;
  }

  function renderTabs() {
    var strip = document.getElementById('tabStrip');
    strip.innerHTML = '';
    tabs.forEach(function (tab) {
      var el = document.createElement('span');
      el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
      var label = document.createElement('span');
      label.textContent = tab.title;
      el.appendChild(label);
      if (tab.type !== 'home') {
        var close = document.createElement('span');
        close.className = 'tab-close';
        close.setAttribute('aria-label', '关闭标签页');
        close.innerHTML = '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        close.addEventListener('click', function (e) {
          e.stopPropagation();
          closeTab(tab.id);
        });
        el.appendChild(close);
      }
      el.addEventListener('click', function () { activateTab(tab.id); });
      strip.appendChild(el);
    });
  }

  function activateTab(id) {
    activeTabId = id;
    var tab = getTab(id);
    var isHome = tab.type === 'home';

    /* home 标签内容 */
    home.className = 'search-home' + (isHome && homeView === 'home' ? ' show' : '');
    result.className = 'search-result' + (isHome && homeView === 'search' ? ' show' : '');

    /* iframe 标签内容 */
    var pages = document.querySelectorAll('.tab-page');
    for (var i = 0; i < pages.length; i++) {
      pages[i].className = 'tab-page' + (pages[i].getAttribute('data-tab') === id ? ' show' : '');
    }

    document.getElementById('addressInput').value = tab.url;
    renderTabs();
  }

  function openPage(title, url) {
    /* 已打开过同一网页则直接切到该标签 */
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].type === 'page' && tabs[i].url === url) {
        activateTab(tabs[i].id);
        return;
      }
    }
    tabSeq++;
    var id = 't' + tabSeq;
    tabs.push({ id: id, title: title, type: 'page', url: url });

    var holder = document.createElement('div');
    holder.className = 'tab-page';
    holder.id = 'page-' + id;
    holder.setAttribute('data-tab', id);
    var iframe = document.createElement('iframe');
    iframe.src = url;
    holder.appendChild(iframe);
    document.getElementById('tabPages').appendChild(holder);

    activateTab(id);
  }

  function closeTab(id) {
    var idx = -1;
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].id === id) { idx = i; break; }
    }
    if (idx === -1 || tabs[idx].type === 'home') return; /* 首页标签不可关闭 */

    tabs.splice(idx, 1);
    var holder = document.getElementById('page-' + id);
    if (holder && holder.parentNode) holder.parentNode.removeChild(holder);

    if (activeTabId === id) {
      var next = tabs[idx] || tabs[idx - 1] || tabs[0];
      activateTab(next.id);
    } else {
      renderTabs();
    }
  }

  /* ===== 浏览器搜索 ===== */
  var DREAM_FORUM_PAGE = 'HomepageDream.html'; /* 梦境论坛（已有页面） */
  var XIAOMEI_PAGE     = 'Yexiaomei.html';     /* 叶小美个人简介（已有页面） */
  var UNIVERSITY_PAGE  = 'University.html';    /* xx大学简介（网页待写，改这里） */

  var RESULT_SETS = [
    { keywords: ['梦境'], items: [
      { title: '梦境论坛', url: DREAM_FORUM_PAGE, desc: '梦境爱好者交流社区，分享你的梦境故事。' },
      { title: '梦境的奥秘', url: null, desc: '探索梦境背后的秘密。' }
    ]},
    { keywords: ['叶小美'], items: [
      { title: '叶小美个人简介', url: XIAOMEI_PAGE, desc: '查看叶小美的个人简介。' },
      { title: 'xx大学简介', url: UNIVERSITY_PAGE, desc: 'xx大学官方简介。' }
    ]}
  ];

  function renderResults(items) {
    var list = document.getElementById('resultList');
    list.innerHTML = '';
    items.forEach(function (item) {
      var el = document.createElement('div');
      el.className = 'result-item ' + (item.url ? 'openable' : 'locked');
      el.innerHTML =
        '<div class="r-title">' + item.title + '</div>' +
        '<div class="r-url">' + (item.url ? item.url : '—') + '</div>' +
        '<div class="r-desc">' + item.desc + '</div>';
      if (item.url) {
        el.addEventListener('click', function () {
          openPage(item.title, item.url);
        });
      } else {
        el.addEventListener('click', function () {
          /* 无操作：该结果打不开 */
        });
      }
      list.appendChild(el);
    });
  }

  function doSearch() {
    var q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    var set = null;
    for (var i = 0; i < RESULT_SETS.length && !set; i++) {
      for (var j = 0; j < RESULT_SETS[i].keywords.length; j++) {
        if (q.indexOf(RESULT_SETS[i].keywords[j]) !== -1) { set = RESULT_SETS[i]; break; }
      }
    }

    var address = document.getElementById('addressInput');
    var empty = document.getElementById('resultEmpty');

    if (set) {
      address.value = 'https://www.互联网.com/s?q=' + encodeURIComponent(q);
      document.getElementById('resultHead').textContent = '搜索“' + q + '”的结果';
      empty.style.display = 'none';
      renderResults(set.items);
    } else {
      address.value = 'https://www.互联网.com/s?q=' + encodeURIComponent(q);
      document.getElementById('resultHead').textContent = '搜索“' + q + '”的结果';
      empty.style.display = 'block';
      empty.textContent = '未找到与“' + q + '”相关的网页，请换个关键词试试。';
      document.getElementById('resultList').innerHTML = '';
    }

    homeView = 'search';
    if (activeTabId === 'home') {
      home.className = 'search-home';
      result.className = 'search-result show';
    }
  }

  document.getElementById('searchBtn').addEventListener('click', doSearch);
  document.getElementById('searchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { doSearch(); }
  });

  document.getElementById('backBtn').addEventListener('click', function () {
    homeView = 'home';
    if (activeTabId === 'home') {
      home.className = 'search-home show';
      result.className = 'search-result';
    }
    document.getElementById('addressInput').value = 'https://www.互联网.com';
    document.getElementById('searchInput').focus();
  });

  /* 初始化：显示首页标签 */
  renderTabs();
  activateTab('home');
</script>
</body>
</html>
